name: Build Salati APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract Assets
        run: |
          mkdir -p temp_src
          unzip -o "مجلد جديد.zip" -d temp_src/ || true

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          channel: 'stable'

      - name: Setup App
        run: |
          flutter create --org com.salati app
          
          # ضبط إصدارات الأندرويد المطلوبة
          sed -i 's/compileSdkVersion flutter.compileSdkVersion/compileSdkVersion 35/g' app/android/app/build.gradle
          sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 35/g' app/android/app/build.gradle
          sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 21/g' app/android/app/build.gradle

          # نسخ مجلد الصوتيات إذا وجد
          find temp_src -type d -name "assets" -exec cp -r {} app/ \; || true

          # كتابة pubspec.yaml
          cat << 'EOF' > app/pubspec.yaml
          name: salati_app
          description: Salati Prayer Times App
          publish_to: 'none'
          version: 1.0.0+1

          environment:
            sdk: '>=3.0.0 <4.0.0'

          dependencies:
            flutter:
              sdk: flutter
            audioplayers: ^6.0.0
            shared_preferences: ^2.2.2
            flutter_local_notifications: ^17.0.0
            intl: ^0.19.0

          flutter:
            uses-material-design: true
            assets:
              - assets/
          EOF

          # فحص السطر 471 واستبدال children بـ child في ملف main.dart بدقة
          find temp_src -name "main.dart" -exec cp {} app/lib/main.dart \;
          perl -i -pe 's/children:\s*\[/child: Column(children: [/ if $. == 471' app/lib/main.dart
          perl -i -pe 's/const\s+Padding/Padding/ if $. >= 465 && $. <= 471' app/lib/main.dart
          # إغلاق الـ Column قبل إغلاق الـ Padding مباشرة
          perl -0777 -i -pe 's/(\s*)(\]\s*,\s*\n\s*\)\s*;\s*\n\s*\}\s*\n\})/$1])$2/' app/lib/main.dart || true

      - name: Build APK
        working-directory: app
        run: |
          flutter pub get
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Salati-App
          path: app/build/app/outputs/flutter-apk/app-release.apk
