name: Build Salati APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract User Code
        run: |
          mkdir -p temp_src
          unzip -o "مجلد جديد.zip" -d temp_src/

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          channel: 'stable'

      - name: Scaffold Flutter App & Inject Code
        run: |
          flutter create --org com.salati app
          
          # نقل ملف الإعدادات والكود
          find temp_src -name "pubspec.yaml" -exec cp {} app/pubspec.yaml \;
          find temp_src -name "main.dart" -exec cp {} app/lib/main.dart \;
          find temp_src -type d -name "assets" -exec cp -r {} app/ \;

          # تصحيح خطأ children داخل Padding تلقائياً
          sed -i 's/const Padding(/Padding(/g' app/lib/main.dart
          sed -i 's/children: \[/child: Column(children: \[/g' app/lib/main.dart

          # رفع إصدار SDK إلى 35 المطلوب
          sed -i 's/compileSdkVersion flutter.compileSdkVersion/compileSdkVersion 35/g' app/android/app/build.gradle
          sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 35/g' app/android/app/build.gradle

      - name: Build APK
        working-directory: app
        run: |
          flutter pub get
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Salati-App
          path: app/build/app/outputs/flutter-apk/app-release.apk
