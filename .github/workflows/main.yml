name: Build Salati APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract Audio Files
        run: |
          mkdir -p temp_src
          unzip -o "مجلد جديد.zip" -d temp_src/ || true

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Android Platform 35
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          channel: 'stable'

      - name: Build Clean App Structure
        run: |
          flutter create --org com.salati app
          
          # إعدادات الأندرويد
          sed -i 's/compileSdkVersion flutter.compileSdkVersion/compileSdkVersion 35/g' app/android/app/build.gradle
          sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 35/g' app/android/app/build.gradle
          sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 21/g' app/android/app/build.gradle

          # نسخ ملف الصوت
          mkdir -p app/assets
          find temp_src -name "*.mp3" -exec cp {} app/assets/ \; || true

          # ضبط pubspec.yaml
          cat << 'EOF' > app/pubspec.yaml
          name: salati_app
          description: Salati Prayer Times App
          publish_to: 'none'
          version: 1.0.0+1

          environment:
            sdk: '>=3.0.0 <4.0.0'

          dependencies:
            flutter:
              sdk: flutter
            audioplayers: ^6.0.0
            shared_preferences: ^2.2.2
            flutter_local_notifications: ^17.0.0
            intl: ^0.19.0

          flutter:
            uses-material-design: true
            assets:
              - assets/
          EOF

          # كتابة كود التطبيق المكتمل والسليم
          cat << 'EOF' > app/lib/main.dart
          import 'package:flutter/material.dart';
          import 'package:audioplayers/audioplayers.dart';

          void main() {
            runApp(const SalatiApp());
          }

          class SalatiApp extends StatelessWidget {
            const SalatiApp({super.key});

            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                title: 'تطبيق صلاتي',
                debugShowCheckedModeBanner: false,
                theme: ThemeData(
                  primarySwatch: Colors.teal,
                  fontFamily: 'sans-serif',
                ),
                home: const HomeScreen(),
              );
            }
          }

          class HomeScreen extends StatefulWidget {
            const HomeScreen({super.key});

            @override
            State<HomeScreen> createState() => _HomeScreenState();
          }

          class _HomeScreenState extends State<HomeScreen> {
            final AudioPlayer _player = AudioPlayer();
            bool _isPlaying = false;

            final List<Map<String, String>> _prayers = [
              {'name': 'الفجر', 'time': '04:45 ص'},
              {'name': 'الشروق', 'time': '06:10 ص'},
              {'name': 'الظهر', 'time': '12:30 م'},
              {'name': 'العصر', 'time': '03:45 م'},
              {'name': 'المغرب', 'time': '06:20 م'},
              {'name': 'العشاء', 'time': '07:50 م'},
            ];

            Future<void> _playAzan() async {
              if (_isPlaying) {
                await _player.stop();
                setState(() => _isPlaying = false);
              } else {
                try {
                  await _player.play(AssetSource('azan.mp3'));
                  setState(() => _isPlaying = true);
                } catch (e) {
                  ScaffoldMessenger.of(context).showSnackBar(
                    const SnackBar(content: Text('تعذر تشغيل ملف الأذان')),
                  );
                }
              }
            }

            @override
            void dispose() {
              _player.dispose();
              super.dispose();
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(
                  title: const Text('صلاتي'),
                  centerTitle: true,
                  backgroundColor: Colors.teal[800],
                ),
                body: Padding(
                  padding: const EdgeInsets.all(16.0),
                  child: Column(
                    children: [
                      Card(
                        elevation: 4,
                        shape: RoundedRectangleBorder(borderRadius: BorderRadius.circular(15)),
                        color: Colors.teal[50],
                        child: Padding(
                          padding: const EdgeInsets.all(20.0),
                          child: Column(
                            children: [
                              const Icon(Icons.mosque, size: 60, color: Colors.teal),
                              const SizedBox(height: 10),
                              const Text(
                                'مواقيت الصلاة والأذان',
                                style: TextStyle(fontSize: 22, fontWeight: FontWeight.bold, color: Colors.teal),
                              ),
                              const SizedBox(height: 15),
                              ElevatedButton.icon(
                                onPressed: _playAzan,
                                icon: Icon(_isPlaying ? Icons.stop : Icons.play_arrow),
                                label: Text(_isPlaying ? 'إيقاف الأذان' : 'تجربة صوت الأذان'),
                                style: ElevatedButton.styleFrom(
                                  backgroundColor: Colors.teal,
                                  foregroundColor: Colors.white,
                                  padding: const EdgeInsets.symmetric(horizontal: 20, vertical: 12),
                                  shape: RoundedRectangleBorder(borderRadius: BorderRadius.circular(25)),
                                ),
                              ),
                            ],
                          ),
                        ),
                      ),
                      const SizedBox(height: 20),
                      Expanded(
                        child: ListView.builder(
                          itemCount: _prayers.length,
                          itemBuilder: (context, index) {
                            final prayer = _prayers[index];
                            return Card(
                              margin: const EdgeInsets.symmetric(vertical: 6),
                              shape: RoundedRectangleBorder(borderRadius: BorderRadius.circular(10)),
                              child: ListTile(
                                leading: const Icon(Icons.access_time, color: Colors.teal),
                                title: Text(
                                  prayer['name']!,
                                  style: const TextStyle(fontWeight: FontWeight.bold, fontSize: 18),
                                ),
                                trailing: Text(
                                  prayer['time']!,
                                  style: const TextStyle(fontSize: 16, color: Colors.grey, fontWeight: FontWeight.bold),
                                ),
                              ),
                            );
                          },
                        ),
                      ),
                    ],
                  ),
                ),
              );
            }
          }
          EOF

      - name: Build APK
        working-directory: app
        run: |
          flutter pub get
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Salati-App
          path: app/build/app/outputs/flutter-apk/app-release.apk
