name: Build Salati APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'

      - name: Extract and Configure Salati Project
        run: |
          flutter create --org com.abuhussein.salati salati_build
          mkdir -p extracted_zip
          unzip -o "مجلد جديد.zip" -d extracted_zip
          
          SRC_DIR=$(find extracted_zip -name "pubspec.yaml" -printf '%h\n' | head -n 1)
          cp -rf "$SRC_DIR/lib" salati_build/
          if [ -d "$SRC_DIR/assets" ]; then cp -rf "$SRC_DIR/assets" salati_build/; fi
          cp -f "$SRC_DIR/pubspec.yaml" salati_build/
          
          cd salati_build
          mkdir -p assets

          ICON_FILE=$(find .. -maxdepth 4 \( -iname "*icon*.png" -o -iname "*logo*.png" \) | head -n 1)
          if [ -n "$ICON_FILE" ]; then
            cp -f "$ICON_FILE" assets/icon.png
          fi

          flutter pub get

          ICON_REF="@mipmap/ic_launcher"
          if [ -f "assets/icon.png" ]; then
            if dart run flutter_launcher_icons; then
              ICON_REF="@mipmap/launcher_icon"
            fi
          fi
          
          cat << EOF > android/app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/>
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>
              <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM"/>
              <uses-permission android:name="android.permission.USE_EXACT_ALARM"/>
              <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED"/>
              <uses-permission android:name="android.permission.VIBRATE"/>
              <uses-permission android:name="android.permission.WAKE_LOCK"/>
              <uses-permission android:name="android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS"/>

              <application
                  android:label="صلاتي"
                  android:name="\${applicationName}"
                  android:icon="$ICON_REF">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTop"
                      android:theme="@style/LaunchTheme"
                      android:configChanges="orientation|keyboardHidden|keyboard|screenSize|smallestScreenSize|locale|layoutDirection|fontScale|screenLayout|density|uiMode"
                      android:hardwareAccelerated="true"
                      android:windowSoftInputMode="adjustResize">
                      <meta-data
                        android:name="io.flutter.embedding.android.NormalTheme"
                        android:resource="@style/NormalTheme"
                        />
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  <meta-data
                      android:name="flutterEmbedding"
                      android:value="2" />
              </application>
          </manifest>
          EOF

          # ضبط compileSdk 34 و minSdk 21 المتوافق تماماً مع Flutter 3.22.0
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 21/g' android/app/build.gradle
          sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 21/g' android/app/build.gradle
          sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 34/g' android/app/build.gradle
          sed -i 's/compileSdkVersion flutter.compileSdkVersion/compileSdkVersion 34/g' android/app/build.gradle

          flutter build apk --release

      - name: Upload Salati APK
        uses: actions/upload-artifact@v4
        with:
          name: Salati-1.6.0-Release
          path: salati_build/build/app/outputs/flutter-apk/app-release.apk
