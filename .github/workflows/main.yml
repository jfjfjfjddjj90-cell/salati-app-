name: Build Salati APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract User Code
        run: |
          mkdir -p temp_src
          unzip -o "مجلد جديد.zip" -d temp_src/
          find temp_src -type f

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          channel: 'stable'

      - name: Scaffold Flutter App & Inject Code
        run: |
          # 1. Create a fresh standard Flutter project
          flutter create --org com.salati app
          
          # 2. Copy pubspec.yaml
          find temp_src -name "pubspec.yaml" -exec cp {} app/pubspec.yaml \;
          
          # 3. Copy main.dart
          find temp_src -name "main.dart" -exec cp {} app/lib/main.dart \;
          
          # 4. Copy assets folder if exists
          find temp_src -type d -name "assets" -exec cp -r {} app/ \;

      - name: Build APK
        working-directory: app
        run: |
          flutter pub get
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Salati-App
          path: app/build/app/outputs/flutter-apk/app-release.apk
