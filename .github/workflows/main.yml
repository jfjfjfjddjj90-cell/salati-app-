name: Build Salati APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract User Code
        run: |
          mkdir -p temp_src
          unzip -o "مجلد جديد.zip" -d temp_src/

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          channel: 'stable'

      - name: Prepare Clean Project
        run: |
          flutter create --org com.salati app
          
          # ضبط إصدارات الأندرويد المطلوبة
          sed -i 's/compileSdkVersion flutter.compileSdkVersion/compileSdkVersion 35/g' app/android/app/build.gradle
          sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 35/g' app/android/app/build.gradle
          sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 21/g' app/android/app/build.gradle

          # نسخ مجلد الصوتيات
          find temp_src -type d -name "assets" -exec cp -r {} app/ \;

          # كتابة ملف pubspec.yaml
          cat << 'EOF' > app/pubspec.yaml
          name: salati_app
          description: Salati Prayer Times App
          publish_to: 'none'
          version: 1.0.0+1

          environment:
            sdk: '>=3.0.0 <4.0.0'

          dependencies:
            flutter:
              sdk: flutter
            audioplayers: ^6.0.0
            shared_preferences: ^2.2.2
            flutter_local_notifications: ^17.0.0
            intl: ^0.19.0

          flutter:
            uses-material-design: true
            assets:
              - assets/
          EOF

          # نسخ ملف main.dart الأصلي
          find temp_src -name "main.dart" -exec cp {} app/lib/main.dart \;
          
          # استبدال children بـ child في ويدجت Padding فقط
          python3 -c "
          with open('app/lib/main.dart', 'r', encoding='utf-8') as f:
              content = f.read()
          # تصحيح الخطأ الأصلي في Padding
          content = content.replace('Padding(\n            padding: const EdgeInsets.all(16.0),\n            children: [', 'Padding(\n            padding: const EdgeInsets.all(16.0),\n            child: Column(\n              children: [')
          content = content.replace('Padding(\n          padding: const EdgeInsets.all(16.0),\n          children: [', 'Padding(\n          padding: const EdgeInsets.all(16.0),\n          child: Column(\n            children: [')
          # إضافة إغلاق الـ Column إذا لزم الأمر
          if 'child: Column(' in content and not ')\n    );\n  }\n}' in content:
              content = content.replace('      ],\n    );\n  }\n}', '      ],\n    )\n    );\n  }\n}')
          with open('app/lib/main.dart', 'w', encoding='utf-8') as f:
              f.write(content)
          "

      - name: Build APK
        working-directory: app
        run: |
          flutter pub get
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Salati-App
          path: app/build/app/outputs/flutter-apk/app-release.apk
